name: Update WakaTime Stats

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-wakatime.yml
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  HAS_WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY != '' }}
  WAKATIME_API_READY: "false"

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Notice missing WakaTime secret
        if: env.HAS_WAKATIME_API_KEY != 'true'
        run: echo "::notice::Set the WAKATIME_API_KEY repository secret to enable WakaTime updates."

      - name: Validate WakaTime API access
        if: env.HAS_WAKATIME_API_KEY == 'true'
        run: |
          status_code="$(curl -s -o /dev/null -w "%{http_code}" --user "${{ secrets.WAKATIME_API_KEY }}:" "https://wakatime.com/api/v1/users/current/status_bar/today" || echo "000")"
          if [ "$status_code" = "200" ]; then
            echo "WAKATIME_API_READY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::WakaTime API request returned HTTP ${status_code}. Skipping README update."
            echo "WAKATIME_API_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Update WakaTime section
        if: env.HAS_WAKATIME_API_KEY == 'true' && env.WAKATIME_API_READY == 'true'
        uses: athul/waka-readme@master
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SECTION_NAME: waka
          SHOW_TIME: true
          TIME_RANGE: last_7_days
          LANG_COUNT: 8
          SHOW_TOTAL: true
